name: Sync Release to Public Repo

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.2.8)'
        required: true

jobs:
  sync-release:
    if: github.repository == 'blue-idea/collection'
    runs-on: ubuntu-latest
    steps:
      - name: Sync Release Assets
        env:
          SRC_REPO: "blue-idea/collection"
          DEST_REPO: "blue-idea/linkit"
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "No release tag found." >&2
            exit 1
          fi

          echo "Syncing release $TAG from $SRC_REPO to $DEST_REPO..."

          # 1. 下载私有仓库的 release 资产与文本描述
          mkdir -p release_assets
          gh release download "$TAG" --repo "$SRC_REPO" --dir release_assets || true

          BODY="$(gh release view "$TAG" --repo "$SRC_REPO" --json body --jq '.body')"
          TITLE="$(gh release view "$TAG" --repo "$SRC_REPO" --json name --jq '.name')"
          if [[ "$TITLE" == "$TAG" ]]; then
            TITLE="$TAG - Smart Knowledge Curation Space"
          fi

          # 2. 在公开仓库创建或更新 Release
          gh release view "$TAG" --repo "$DEST_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$DEST_REPO" --title "$TITLE" --notes "$BODY" || true

          # 3. 上传所有二进制产物到公开仓库
          if [ -d release_assets ] && [ "$(ls -A release_assets)" ]; then
            gh release upload "$TAG" release_assets/* --repo "$DEST_REPO" --clobber
          fi

          echo "Successfully synced release $TAG to $DEST_REPO."
