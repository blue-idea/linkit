name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: false

permissions:
  contents: write

env:
  GO_VERSION: '1.26'
  PNPM_VERSION: '10.33.0'
  WAILS_VERSION: v2.13.0
  NFPM_VERSION: v2.47.0

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            os: linux
            deb_arch: amd64
          - runner: windows-latest
            platform: windows/amd64
            os: windows
          - runner: macos-latest
            platform: darwin/universal
            os: macos

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Release Tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z.W" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          # golang.design/x/hotkey 在生成 bindings 时需可连接的 X11 显示（无头 CI 用 xvfb）
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xdg-utils xvfb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Assert release identity (no dev tag)
        shell: bash
        run: |
          go test ./config -run 'TestReleaseIdentitySlot|TestIdentityIsolationInvariants' -count=1
          out="$(go run ./scripts/check-identity)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qx 'profile=release'
          printf '%s\n' "$out" | grep -qx 'secretService=Linkit'
          printf '%s\n' "$out" | grep -qx 'title=Linkit'
          if printf '%s\n' "$out" | grep -q 'Linkit-Dev'; then
            echo "Release identity must not use Linkit-Dev" >&2
            exit 1
          fi

      - name: Build frontend
        run: pnpm --dir ui build

      - name: Install nFPM
        if: matrix.os == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}

      - name: Build Wails desktop app (Linux)
        if: matrix.os == 'linux'
        run: xvfb-run -a go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -clean -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            throw "makensis.exe not found under $nsisDir"
          }
          # 确保后续步骤与 wails -nsis 能找到 makensis
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          & (Join-Path $nsisDir 'makensis.exe') /VERSION

      - name: Build Wails desktop app (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsisDir) {
            $env:Path = "$nsisDir;$env:Path"
          }
          go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -clean -platform ${{ matrix.platform }} -nsis
          if (-not (Test-Path 'build/bin/linkit-amd64-installer.exe')) {
            Get-ChildItem build/bin -ErrorAction SilentlyContinue | Format-Table Name,Length
            throw 'NSIS installer was not produced'
          }

      - name: Build Wails desktop app (macOS)
        if: matrix.os == 'macos'
        run: go run github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }} build -clean -platform ${{ matrix.platform }}

      - name: Build DMG (macOS)
        if: matrix.os == 'macos'
        run: |
          mkdir -p build/bin/dmg_root
          cp -R build/bin/Linkit.app build/bin/dmg_root/
          ln -s /Applications build/bin/dmg_root/Applications
          hdiutil create -volname "Linkit" -srcfolder build/bin/dmg_root -ov -format UDZO build/bin/Linkit.dmg
          rm -rf build/bin/dmg_root

      - name: Copy architecture-specific binary (Linux)
        if: matrix.os == 'linux'
        run: cp build/bin/linkit build/bin/linkit-${{ matrix.deb_arch }}

      - name: Build Debian package (Linux)
        if: matrix.os == 'linux'
        env:
          NFPM_ARCH: ${{ matrix.deb_arch }}
          PACKAGE_VERSION: ${{ env.RELEASE_TAG }}
          PACKAGE_RELEASE: '1'
        run: nfpm pkg --packager deb --target build/bin/linkit_${{ env.RELEASE_TAG }}_${{ matrix.deb_arch }}.deb

      - name: Verify release artifacts (Linux)
        if: matrix.os == 'linux'
        run: |
          test -x "build/bin/linkit-${{ matrix.deb_arch }}"
          test -f "build/bin/linkit_${{ env.RELEASE_TAG }}_${{ matrix.deb_arch }}.deb"
          if grep -aF "Linkit-Dev" "build/bin/linkit-${{ matrix.deb_arch }}"; then
            echo "Release binary must not embed Linkit-Dev" >&2
            exit 1
          fi

      - name: Verify release artifacts (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/linkit-amd64-installer.exe")) { throw "Installer not found" }
          $exe = "build/bin/linkit.exe"
          if (-not (Test-Path $exe)) { throw "linkit.exe not found" }
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($ascii.Contains("Linkit-Dev")) { throw "Release binary must not embed Linkit-Dev" }

      - name: Verify release artifacts (macOS)
        if: matrix.os == 'macos'
        run: |
          test -f "build/bin/Linkit.dmg"
          binary="$(find build/bin/Linkit.app/Contents/MacOS -type f -perm -111 | head -n 1)"
          test -n "$binary"
          if grep -aF "Linkit-Dev" "$binary"; then
            echo "Release binary must not embed Linkit-Dev" >&2
            exit 1
          fi

      - name: Upload Linux artifacts
        if: matrix.os == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1 || gh release create "${{ env.RELEASE_TAG }}" --generate-notes || true
          gh release upload "${{ env.RELEASE_TAG }}" build/bin/linkit-${{ matrix.deb_arch }} build/bin/linkit_${{ env.RELEASE_TAG }}_${{ matrix.deb_arch }}.deb --clobber

      - name: Upload Windows artifacts
        if: matrix.os == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1 || gh release create "${{ env.RELEASE_TAG }}" --generate-notes || true
          cp build/bin/linkit.exe build/bin/linkit-windows-amd64.exe
          gh release upload "${{ env.RELEASE_TAG }}" build/bin/linkit-amd64-installer.exe build/bin/linkit-windows-amd64.exe --clobber

      - name: Upload macOS artifacts
        if: matrix.os == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1 || gh release create "${{ env.RELEASE_TAG }}" --generate-notes || true
          gh release upload "${{ env.RELEASE_TAG }}" build/bin/Linkit.dmg --clobber

  sync-public-release:
    name: Sync Release to Public Repo
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Release Tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z.W" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Sync Assets to Public Repo
        shell: bash
        env:
          SRC_REPO: ${{ github.repository }}
          DEST_REPO: "blue-idea/linkit"
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          echo "Syncing release $RELEASE_TAG from $SRC_REPO to $DEST_REPO..."

          # 1. 下载私有仓库的所有 release 资产与描述
          mkdir -p release_assets
          gh release download "$RELEASE_TAG" --repo "$SRC_REPO" --dir release_assets || true

          BODY="$(gh release view "$RELEASE_TAG" --repo "$SRC_REPO" --json body --jq '.body' 2>/dev/null || true)"
          TITLE="$(gh release view "$RELEASE_TAG" --repo "$SRC_REPO" --json name --jq '.name' 2>/dev/null || true)"
          if [[ -z "$TITLE" || "$TITLE" == "$RELEASE_TAG" ]]; then
            TITLE="$RELEASE_TAG - Smart Knowledge Curation Space"
          fi

          # 2. 在公开仓库创建或更新 Release
          gh release view "$RELEASE_TAG" --repo "$DEST_REPO" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$DEST_REPO" --title "$TITLE" --notes "$BODY" || true

          # 3. 上传所有二进制产物到公开仓库
          if [ -d release_assets ] && [ "$(ls -A release_assets)" ]; then
            gh release upload "$RELEASE_TAG" release_assets/* --repo "$DEST_REPO" --clobber
          fi

          echo "Successfully synced release $RELEASE_TAG to $DEST_REPO."

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: sync-public-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: linkit-homebrew-tap
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine Release Tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z.W" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Load Homebrew Tap config
        id: tap-config
        shell: bash
        run: |
          echo "tap_repository=$(jq -r '.tapRepository' config/homebrew-tap.json)" >> "$GITHUB_OUTPUT"
          echo "release_repository=$(jq -r '.releaseRepository' config/homebrew-tap.json)" >> "$GITHUB_OUTPUT"
          echo "cask_path=$(jq -r '.caskRelativePath' config/homebrew-tap.json)" >> "$GITHUB_OUTPUT"
          echo "release_asset=$(jq -r '.releaseAsset' config/homebrew-tap.json)" >> "$GITHUB_OUTPUT"

      - name: Validate Homebrew Tap token
        shell: bash
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN is required" >&2
            exit 1
          fi

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.tap-config.outputs.tap_repository }}
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap-repository

      - name: Download published DMG and calculate SHA256
        id: release-asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ steps.tap-config.outputs.release_repository }}
          RELEASE_ASSET: ${{ steps.tap-config.outputs.release_asset }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --pattern "$RELEASE_ASSET" \
            --dir release-assets
          test -s "release-assets/$RELEASE_ASSET"
          SHA256="$(sha256sum "release-assets/$RELEASE_ASSET" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew Cask
        shell: bash
        env:
          CASK_PATH: ${{ steps.tap-config.outputs.cask_path }}
          DMG_SHA256: ${{ steps.release-asset.outputs.sha256 }}
        run: |
          node scripts/update-homebrew-cask.mjs \
            --cask "homebrew-tap-repository/$CASK_PATH" \
            --tag "$RELEASE_TAG" \
            --sha256 "$DMG_SHA256"

      - name: Commit and push Homebrew Cask
        shell: bash
        env:
          CASK_PATH: ${{ steps.tap-config.outputs.cask_path }}
          TAP_REPOSITORY: ${{ steps.tap-config.outputs.tap_repository }}
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          cd homebrew-tap-repository
          if git diff --quiet -- "$CASK_PATH"; then
            echo "Homebrew Cask is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$CASK_PATH"
          git commit -m "bump: update Linkit to $RELEASE_TAG"
          if ! git push "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" HEAD:main; then
            echo "::warning::Failed to push updated Cask to $TAP_REPOSITORY. Please verify TAP_GITHUB_TOKEN has write permissions to $TAP_REPOSITORY."
          fi
